name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  core:
    # core/ and tests/core/ are written once in the Local Edition and copied to the Remote Edition. They must match.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: core/ matches the Remote Edition on the same branch name, or main
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/Fireiscoolsolo/canvas-lms-mcp-server.git "$BRANCH" > /dev/null; then REF="$BRANCH"; else REF=main; fi
          echo "Comparing with canvas-lms-mcp-server $REF"
          git clone --quiet --depth 1 --branch "$REF" https://github.com/Fireiscoolsolo/canvas-lms-mcp-server.git ../other
          node scripts/sync-core.mjs --check ../other
          cmp scripts/release-check.mjs ../other/scripts/release-check.mjs
          cmp scripts/profile-table.mjs ../other/scripts/profile-table.mjs

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No known high-severity problems in what users install
        run: npm audit --omit=dev --audit-level=high
      - name: The Claude Desktop extension builds
        run: npm run build-mcpb
